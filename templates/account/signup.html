{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Page title -->
    <title>ArogyaConnect | Sign Up</title>

    <!-- Load Signup CSS from Django static folder -->
    <link
        rel="stylesheet"
        href="{% static 'css/account/signup.css' %}"
    >

</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header>

        <div class="logo">

            <!-- Medical plus icon -->
            <div class="logo-icon">
                +
            </div>

            <!-- Application name -->
            <h1>
                ArogyaConnect
            </h1>

        </div>

        <!-- Application tagline -->
        <div class="header-text">
            Your Health, Our Priority
        </div>

    </header>


    <!-- =========================================
         MAIN CONTAINER
    ========================================== -->

    <main class="main-container">

        <!-- =========================================
             SIGNUP CARD
        ========================================== -->

        <div class="signup-card">


            <!-- =========================================
                 SIGNUP HEADING
            ========================================== -->

            <div class="signup-heading">

                <h2>
                    Create Account
                </h2>

                <p>
                    Join ArogyaConnect and take care of your health
                </p>

            </div>


            <!-- =========================================
                 ERROR MESSAGE
            ========================================== -->

            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <!-- =========================================
                 SIGNUP FORM
            ========================================== -->

            <form method="POST">

                <!-- Django CSRF protection -->
                {% csrf_token %}


                <!-- First Name and Last Name -->
                <div class="form-row">

                    <div class="form-group">

                        <label>
                            First Name
                        </label>

                        <input
                            type="text"
                            name="first_name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Last Name
                        </label>

                        <input
                            type="text"
                            name="last_name"
                            required
                        >

                    </div>

                </div>


                <!-- Middle Name -->
                <div class="form-group">

                    <label>
                        Middle Name
                    </label>

                    <input
                        type="text"
                        name="middle_name"
                    >

                </div>


                <!-- Date of Birth -->
                <div class="form-group">

                    <label>
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        name="date_of_birth"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        required
                    >

                </div>


                <!-- Mobile Number -->
                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        name="mobile_number"
                        required
                    >

                </div>


                <!-- Location -->
                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        required
                    >

                </div>


                <!-- Pincode -->
                <div class="form-group">

                    <label>
                        Pincode
                    </label>

                    <input
                        type="text"
                        name="pincode"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        required
                    >

                </div>


                <!-- Signup Button -->
                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Account
                </button>

            </form>


            <!-- =========================================
                 LOGIN LINK
            ========================================== -->

            <div class="login-link">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </div>

        </div>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        © 2026 ArogyaConnect ·
        Connecting You to Better Healthcare

    </footer>

</body>

</html>
