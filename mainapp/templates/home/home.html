
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArogyaConnect | Choose Account</title>

    <link rel="stylesheet"
          href="{% static 'css/home/home.css' %}">
</head>

<body>

<div class="container">

    <h1>ArogyaConnect</h1>
    <p class="subtitle">Choose your account type</p>

    <form method="POST" action="{% url 'signup' %}">
        {% csrf_token %}

        <div class="account-options">

            <!-- Patient -->
            <label class="account-card patient">
                <input type="radio" name="role" value="patient" required>

                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="7" r="4"/>
                    <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                </svg>

                <h2>Patient</h2>
            </label>

            <!-- Doctor -->
            <label class="account-card doctor">
                <input type="radio" name="role" value="doctor">

                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 3v5a4 4 0 0 0 8 0V5"/>
                    <path d="M14 5a2 2 0 1 1 4 0v3"/>
                    <path d="M10 12v2a4 4 0 0 0 8 0v-1"/>
                    <circle cx="6" cy="3" r="2"/>
                    <circle cx="18" cy="5" r="2"/>
                    <circle cx="18" cy="13" r="2"/>
                </svg>

                <h2>Doctor</h2>
            </label>

            <!-- Hospital -->
            <label class="account-card hospital">
                <input type="radio" name="role" value="hospital">

                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M12 8v8M8 12h8"/>
                    <path d="M8 4V2h8v2"/>
                </svg>

                <h2>Hospital</h2>
            </label>

        </div>

        <button type="submit" class="continue-btn">
            Continue
        </button>

    </form>

    <p class="footer-text">
        Select your account type to continue registration.
    </p>

</div>

</body>
</html>
