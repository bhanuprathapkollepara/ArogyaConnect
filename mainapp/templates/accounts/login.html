<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArogyaConnect | Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; color: #111827; }
        .container { max-width: 620px; margin: 80px auto; background: white; border-radius: 18px; padding: 30px; box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08); }
        .top-nav { display: flex; justify-content: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .top-nav a { text-decoration: none; color: #0b6bb5; font-weight: 600; }
        h1 { margin-bottom: 10px; }
        p { color: #4b5563; }
        form { display: grid; gap: 16px; margin-top: 20px; }
        input, button { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 16px; }
        button { background: #0b6bb5; color: white; border: none; cursor: pointer; font-weight: 700; }
        .helper { margin-top: 18px; color: #4b5563; }
        .helper a { color: #0b6bb5; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <a href="/">Home</a>
            <a href="/about/">About</a>
            <a href="/contact/">Contact</a>
            <a href="/accounts/signup/?role={{ role }}">Sign up</a>
        </nav>
        <h1>Welcome back</h1>
        <p>Login to your {{ role|title }} account.</p>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="role" value="{{ role }}">
            <input type="email" name="email" placeholder="Email address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p class="helper">New here? <a href="/accounts/signup/?role={{ role }}">Create an account</a></p>
    </div>
</body>
</html>
