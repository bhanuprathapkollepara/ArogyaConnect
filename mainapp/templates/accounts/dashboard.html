<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArogyaConnect | Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #edf6ff; margin: 0; color: #111827; }
        .container { max-width: 980px; margin: 50px auto; background: white; border-radius: 18px; padding: 30px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); }
        .top-nav { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .top-nav a { text-decoration: none; color: #0b6bb5; font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-top: 20px; }
        .card { background: #f8fbff; border: 1px solid #dbeafe; border-radius: 12px; padding: 20px; }
        .card h3 { margin-top: 0; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <div>
                <a href="/">Home</a>
                <a href="/about/">About</a>
                <a href="/contact/">Contact</a>
            </div>
            <a href="/accounts/login/">Logout</a>
        </nav>
        <h1>Dashboard</h1>
        <p>Welcome to your ArogyaConnect workspace.</p>
        <div class="grid">
            <div class="card"><h3>Appointments</h3><p>View and manage scheduled visits.</p></div>
            <div class="card"><h3>Medical Records</h3><p>Track patient history and documents.</p></div>
            <div class="card"><h3>Messages</h3><p>Communicate with doctors or hospitals.</p></div>
        </div>
    </div>
</body>
</html>
